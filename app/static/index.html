<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WolfeAlpha — 计算知识引擎</title>
<meta name="description" content="Wolfram|Alpha 风格的个人计算知识引擎">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#c8100a">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css?v=6">
</head>
<body class="landing">
<div class="wrap">
  <header class="top">
    <a class="logo" id="homeLink" href="/"><span class="lw">Wolfe</span><span class="la">Alpha</span></a>
    <form id="search" autocomplete="off">
      <div class="box">
        <input id="q" type="text" maxlength="500" placeholder="输入计算或知识问题（中英文均可，例如：中国人口 / integrate x^2 from 0 to 3）" required>
        <button type="submit" title="计算">计算</button>
      </div>
    </form>
    <p class="tagline">计算知识引擎 · 个人实验版 <span class="dim">powered by Wolfram</span></p>
  </header>

  <section id="landing">
    <div id="recent-row" class="recent-row" hidden><span class="hint">最近：</span><div class="chipwrap" id="recent"></div></div>
    <div class="cats">
      <div class="cat cat-1">
        <h4>数学 ›</h4>
        <button class="chip" data-q="integrate x^2 from 0 to 3">integrate x^2 from 0 to 3</button>
        <button class="chip" data-q="solve x^2 - 5x + 6 = 0">solve x^2 - 5x + 6 = 0</button>
        <button class="chip" data-q="plot sin(x)/x from -10 to 10">plot sin(x)/x</button>
        <button class="chip" data-q="derivative of x^3 sin(x)">derivative of x^3 sin(x)</button>
      </div>
      <div class="cat cat-2">
        <h4>科学与技术 ›</h4>
        <button class="chip" data-q="boiling point of water">boiling point of water</button>
        <button class="chip" data-q="speed of light">speed of light</button>
        <button class="chip" data-q="distance from Earth to Mars">distance from Earth to Mars</button>
        <button class="chip" data-q="molar mass of caffeine">molar mass of caffeine</button>
      </div>
      <div class="cat cat-3">
        <h4>社会与文化 ›</h4>
        <button class="chip" data-q="population of Japan">population of Japan</button>
        <button class="chip" data-q="100 USD to CNY">100 USD to CNY</button>
        <button class="chip" data-q="time in Tokyo">time in Tokyo</button>
        <button class="chip" data-q="GDP of France">GDP of France</button>
      </div>
      <div class="cat cat-4">
        <h4>日常生活 ›</h4>
        <button class="chip" data-q="calories in an apple">calories in an apple</button>
        <button class="chip" data-q="sunrise in Shanghai">sunrise in Shanghai</button>
        <button class="chip" data-q="moon phase">moon phase</button>
        <button class="chip" data-q="BMI 175cm 70kg">BMI 175cm 70kg</button>
      </div>
    </div>
  </section>

  <section id="status" class="status" hidden></section>
  <section id="result"></section>

  <footer>
    <p>结果由 Wolfram|Alpha 官方免费接口提供 · <a href="https://www.wolframalpha.com" target="_blank" rel="noopener">wolframalpha.com</a></p>
    <p>非官方个人学习项目 · 查询结果会本地缓存以节省配额</p>
  </footer>
</div>
<script src="/static/vendor/markdown-it.min.js"></script>
<script src="/static/app.js?v=12"></script>
</body>
</html>
